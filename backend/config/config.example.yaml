# Baobaobai Vault configuration template
#
# Usage:
#   1) Copy this file to `backend/config/config.yaml`
#   2) Fill in your own values (DO NOT commit real secrets)
#
# Config search paths (see `backend/internal/config/config.go`):
#   - current working directory
#   - ./config
#   - /etc/baobaobaivault

server:
  port: "8080"
  read_timeout: 30
  write_timeout: 30
  mode: debug # debug, release, test
  admin_email: "" # recommended: set to the sharefrontend super admin email

cors:
  enabled: true
  allow_origins:
    - "http://localhost:3002"
    - "http://127.0.0.1:3002"
  allow_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
  allow_headers: ["Authorization", "Content-Type", "X-Requested-With", "X-Timestamp"]
  expose_headers: ["Content-Disposition", "Content-Length", "ETag"]
  allow_credentials: false
  max_age: 86400

share_public_read_cors:
  enabled: true
  # Public read-only share endpoints are intentionally exposed like query APIs:
  #   - /api/share/discover/cards
  #   - /api/share/discover/system-themes
  #   - /api/share/cards/:cardId and public preview/download resources beneath it
  # This keeps public card/theme metadata and package downloads callable from
  # arbitrary browser origins without weakening authenticated write/admin APIs.
  allow_origins: ["*"]
  allow_methods: ["GET", "HEAD", "OPTIONS"]
  allow_headers: ["*"]
  expose_headers: ["Content-Disposition", "Content-Length", "ETag"]
  allow_credentials: false
  max_age: 86400

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  dbname: "baobaobaivault"
  sslmode: "disable"
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 3600 # seconds

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

jwt:
  secret: "your-secret-key-change-in-production"
  expire_time: 24h
  issuer: "baobaobaivault"

storage:
  default_provider: "local" # local, s3, minio
  temp_dir: "/tmp/baobaobaivault" # also used as temporary buffering directory before share media is uploaded to object storage
  max_file_size: 10737418240 # 10GB in bytes

# Share media storage mode note:
# - The switch between local and object storage for share card covers/attachments
#   is configured in `sharefrontend` system management, not here in YAML.
# - System page: `/system/media-storage`

webpush:
  enabled: false
  # When enabled, exposes mimiwebpushserver-compatible endpoints under `/api/*`:
  #   - GET  /api/health
  #   - GET  /api/push/vapid-public-key
  #   - POST /api/push/subscriptions
  #   - DELETE /api/push/subscriptions
  #   - GET  /api/push/subscriptions (optional auth)
  #   - POST /api/push/test
  #   - POST /api/push/dispatch (optional auth)
  #   - GET  /api/push/events/:eventId (optional auth)
  #   - GET  /api/push/queue (optional auth)
  public_api_enabled: false

  vapid_subject: "mailto:push-admin@example.com"
  vapid_public_key: ""
  vapid_private_key: ""
  allow_vapid_auto_generate: false

  default_ttl_seconds: 300
  # Optional. If set, `GET /api/push/subscriptions`, `/api/push/dispatch`, `/api/push/events/*`, `/api/push/queue`
  # require `x-dispatch-key` or `Authorization: Bearer <key>`.
  dispatch_api_key: ""

  queue_concurrency: 20
  queue_buffer: 1000
  push_proxy_url: ""

email:
  enabled: false
  from_name: "CardShare"
  from_address: ""
  smtp_host: "" # e.g. smtpdm.aliyun.com / smtp.qq.com / smtp.exmail.qq.com / smtp.feishu.cn / smtp.gmail.com
  smtp_port: 587 # usually 587 for STARTTLS, 465 for SSL; Aliyun Direct Mail commonly uses 465 or 80
  smtp_username: "" # usually the full sender email address
  smtp_password: ""

share_auth:
  email_verification_enabled: false # true = registration requires email code verification
  verification_code_ttl_seconds: 600 # 10 minutes
  resend_interval_seconds: 60 # resend cooldown
  max_verify_attempts: 5 # max incorrect code attempts before re-registering

security:
  # 32-byte AES key used to encrypt sensitive DB fields (storage credentials).
  # Provide as base64 string or raw 32-byte string. Leave empty to disable encryption (not recommended).
  field_encryption_key: ""

log:
  level: "info" # debug, info, warn, error
  format: "json" # json, console
