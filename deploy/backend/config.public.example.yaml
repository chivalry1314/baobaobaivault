server:
  port: "8080"
  read_timeout: 30
  write_timeout: 30
  mode: release
  admin_email: ""

cors:
  enabled: true
  allow_origins:
    - "https://share.example.com"
  allow_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
  allow_headers: ["Authorization", "Content-Type", "X-Requested-With", "X-Timestamp"]
  expose_headers: ["Content-Disposition", "Content-Length", "ETag"]
  allow_credentials: true
  max_age: 86400

share_public_read_cors:
  enabled: true
  # Public read-only share endpoints are intentionally exposed like query APIs:
  #   - /api/share/discover/cards
  #   - /api/share/discover/system-themes
  #   - /api/share/cards/:cardId and public preview/download resources beneath it
  allow_origins: ["*"]
  allow_methods: ["GET", "HEAD", "OPTIONS"]
  allow_headers: ["*"]
  expose_headers: ["Content-Disposition", "Content-Length", "ETag"]
  allow_credentials: false
  max_age: 86400

database:
  host: "postgres"
  port: 5432
  user: "vaultuser"
  password: "change-this-postgres-password"
  dbname: "baobaobaivault"
  sslmode: "disable"
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 3600

redis:
  host: "redis"
  port: 6379
  password: "change-this-redis-password"
  db: 0

jwt:
  secret: "change-this-jwt-secret"
  expire_time: 24h
  issuer: "baobaobaivault"

storage:
  default_provider: "local"
  temp_dir: "/tmp/baobaobaivault" # also used as temporary buffering directory before share media is uploaded to object storage
  max_file_size: 10737418240

# Share media storage mode note:
# - The switch between local and object storage for share card covers/attachments
#   is configured in `sharefrontend` system management, not here in YAML.
# - System page: `/system/media-storage`

webpush:
  enabled: false
  public_api_enabled: false
  vapid_subject: "mailto:admin@example.com"
  vapid_public_key: ""
  vapid_private_key: ""
  allow_vapid_auto_generate: false
  default_ttl_seconds: 300
  dispatch_api_key: ""
  queue_concurrency: 20
  queue_buffer: 1000
  push_proxy_url: ""

email:
  enabled: false
  from_name: "CardShare"
  from_address: "noreply@example.com" # should match your verified sender
  smtp_host: "smtp.example.com" # e.g. smtpdm.aliyun.com / smtp.exmail.qq.com
  smtp_port: 587 # 587 STARTTLS / 465 SSL; Aliyun Direct Mail often uses 465
  smtp_username: "noreply@example.com"
  smtp_password: "change-this-smtp-password"

share_auth:
  email_verification_enabled: false
  verification_code_ttl_seconds: 600
  resend_interval_seconds: 60
  max_verify_attempts: 5

log:
  level: "info"
  format: "json"
