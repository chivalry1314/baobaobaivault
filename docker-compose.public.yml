services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baobaobaivault}
      POSTGRES_USER: ${POSTGRES_USER:-vaultuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vaultuser} -d ${POSTGRES_DB:-baobaobaivault}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - vault-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - vault-net

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/chivalry1314/baobaobaivault-backend:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./deploy/backend/config.yaml:/app/config.yaml:ro
      - ./data/storage:/app/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - vault-net

  sharefrontend:
    image: ${SHAREFRONTEND_IMAGE:-ghcr.io/chivalry1314/baobaobaivault-sharefrontend:latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vault-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - sharefrontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - vault-net

networks:
  vault-net:
    driver: bridge
